[package]
name = "elasticvue"
version = "2.0.0"
description = "Elasticsearch frontend"
authors = ["Carsten König"]
license = "MIT"
repository = "https://github.com/cars10/elasticvue"
default-run = "elasticvue"
edition = "2024"
rust-version = "1.85"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
#fetch_reqwest = { path = '../../../rust/fetch_reqwest' }
fetch_reqwest = { git = "https://github.com/cars10/fetch_reqwest" }
path-clean = "1"
env_logger = "0.11.11"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"

[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
lto = true # Enables link to optimizations
opt-level = "s" # Optimize for binary size

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
